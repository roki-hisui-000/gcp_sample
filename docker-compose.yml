services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - SESSION_SECRET=gcp-sample-default-session-secret-key
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:8
    command: valkey-server --save 60 1 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

volumes:
  valkey_data:


